name: Check data and engine
on:
  push:
  pull_request:
  schedule:
    - cron: '0 1 1 * *'   # monthly, 1st of the month
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node --test
  next-year:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/checkout@v4
      - name: Flag missing next-year holidays
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NEXT=$(( $(date +%Y) + 1 ))
          MONTH=$(date +%-m)
          if [ "$MONTH" -ge 7 ] && ! grep -q "\"$NEXT-" data/holidays.json; then
            if ! gh issue list --search "Holidays for $NEXT" --state open | grep -q .; then
              gh issue create --title "Holidays for $NEXT not loaded yet" \
                --body "Next year's public holidays are usually announced mid-year. Add them to data/holidays.json."
            fi
          fi
